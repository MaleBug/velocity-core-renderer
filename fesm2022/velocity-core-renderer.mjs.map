<p-inputnumber
  mode="decimal"
  [inputId]="inputId()"
  [ngModel]="value()"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onValueChange($event)"
  (onFocus)="setFocused(true)"
  (onBlur)="onBlur()"
  (onKeyDown)="onKeyDown($event)"
  [min]="config().min"
  [max]="config().max"
  [step]="config().step"
  [showButtons]="config().showButtons"
  [buttonLayout]="config().buttonLayout"
  [useGrouping]="config().useGrouping"
  [minFractionDigits]="minFractionDigits()"
  [maxFractionDigits]="maxFractionDigits()"
  [prefix]="config().prefix"
  [suffix]="config().suffix"
  [placeholder]="config().placeholder"
  [showClear]="config().showClear"
  [allowEmpty]="config().allowEmpty"
  [locale]="locale()"
  [required]="required()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  [size]="primeSize()"
/>

@if (showsParenthesised()) {
  <!-- Drawn over the control rather than instead of it, so focus, tab order and the value the
       screen reader announces all stay with the real input — which is hidden underneath by the
       stylesheet, not unmounted. `aria-hidden` and `pointer-events: none` keep this from being a
       second thing to read or to click. -->
  <span class="number-field-input__accounting" aria-hidden="true">{{ parenthesisedValue() }}</span>
}
