@if (isRegistered()) {
  @if (showLabel() && label() !== '') {
    <label class="field-input__label" [attr.for]="inputId()">
      {{ label() }}
      @if (required()) {
        <span class="field-input__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <!-- The chosen renderer is created here — see the effect in this component's constructor. -->
  <ng-container #anchor />

  @if (storedValueUnreadable()) {
    <small class="field-input__hint">
      The saved value isn’t something this field can show. It is left untouched until you edit this
      control.
    </small>
  }
} @else {
  <!-- The same bare textarea every field type used before this module existed. An unregistered
       field type is not an error: it is a type nobody has written a renderer for yet, and the
       platform stores its value as a string like every other. -->
  <textarea
    pTextarea
    rows="5"
    [id]="inputId()"
    [ngModel]="value()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="value.set($event ?? '')"
    [disabled]="disabled()"
    [invalid]="invalid()"
  ></textarea>
}
