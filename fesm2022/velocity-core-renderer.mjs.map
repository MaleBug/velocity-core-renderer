@if (config().wysiwyg) {
  <vcr-rich-text-editor
    [inputId]="inputId()"
    [value]="value()"
    (valueChange)="value.set($event)"
    (blurred)="blurred.emit()"
    [rows]="config().rows"
    [required]="required()"
    [disabled]="disabled()"
    [invalid]="invalid()"
  />
} @else {
  <!-- `pSize` is asserted non-null below because `Textarea` declares it as `'large' | 'small'`
       while `InputText` declares the same input as `'large' | 'small' | undefined` — a PrimeNG
       typing inconsistency rather than a real constraint. Both are `isRequired: false`, and the
       directive only ever compares the value by equality, so undefined is exactly "theme
       default". -->
  <textarea
    pTextarea
    [id]="inputId()"
    [ngModel]="value()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="value.set($event ?? '')"
    (blur)="blurred.emit()"
    [rows]="config().rows"
    [placeholder]="config().placeholder"
    [attr.maxlength]="config().maxLength"
    [autoResize]="config().autoResize"
    [required]="required()"
    [disabled]="disabled()"
    [invalid]="invalid()"
    [pSize]="primeSize()!"
  ></textarea>
}

@if (canClear()) {
  <p-button
    class="textarea-field-input__clear"
    label="Clear"
    icon="pi pi-times"
    severity="secondary"
    [text]="true"
    type="button"
    [disabled]="disabled()"
    (onClick)="clear()"
  />
}
