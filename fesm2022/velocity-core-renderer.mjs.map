@if (options().length === 0) {
  <!-- Only reachable through a hand-edited config: the config editor requires at least one
       option, and the host's submit guard blocks a save without one. -->
  <p class="radio-field__empty">This field has no options to choose from yet.</p>
} @else if (config().buttonType) {
  <div
    class="radio-field__buttons"
    [class.radio-field__buttons--small]="config().size === 'small'"
    [class.radio-field__buttons--large]="config().size === 'large'"
    [class.radio-field__buttons--invalid]="invalid()"
    [class.radio-field__buttons--disabled]="disabled()"
    role="radiogroup"
    [attr.aria-label]="groupName()"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-invalid]="invalid() ? true : null"
  >
    @for (option of options(); track option.value) {
      <label
        class="radio-field__button"
        [class.radio-field__button--selected]="value() === option.value"
        [attr.for]="optionId(option.value)"
      >
        <input
          class="radio-field__button-input"
          type="radio"
          [id]="optionId(option.value)"
          [name]="groupName()"
          [value]="option.value"
          [checked]="value() === option.value"
          [disabled]="disabled()"
          [required]="required()"
          (change)="onValueChange(option.value)"
        />
        {{ option.label }}
      </label>
    }
  </div>
} @else {
  <div
    class="radio-field__options"
    [class.radio-field__options--horizontal]="config().orientation === 'horizontal'"
    role="radiogroup"
    [attr.aria-label]="groupName()"
  >
    @for (option of options(); track option.value) {
      <div class="radio-field__option">
        <p-radiobutton
          [inputId]="optionId(option.value)"
          [name]="groupName()"
          [value]="option.value"
          [ngModel]="value()"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="onValueChange($event)"
          [required]="required()"
          [disabled]="disabled()"
          [invalid]="invalid()"
          [size]="primeSize()"
        />
        <label class="radio-field__label" [attr.for]="optionId(option.value)">
          {{ option.label }}
        </label>
      </div>
    }
  </div>
}

@if (canClear() && options().length > 0) {
  <p-button
    label="Clear"
    icon="pi pi-times"
    severity="secondary"
    [text]="true"
    type="button"
    [disabled]="disabled()"
    (onClick)="clear()"
  />
}
