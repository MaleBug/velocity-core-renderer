<section
  #composer
  class="rich-text-editor"
  [class.rich-text-editor--disabled]="disabled()"
  [class.rich-text-editor--invalid]="invalid()"
  (focusout)="onFocusOut($event)"
>
  <div
    #editor
    class="rich-text-editor__box"
    [id]="inputId()"
    [attr.contenteditable]="disabled() ? 'false' : 'true'"
    [style.min-height]="minHeight()"
    role="textbox"
    aria-multiline="true"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="invalid()"
    [attr.aria-disabled]="disabled()"
    (input)="onInput()"
  ></div>

  <!-- `mousedown` is cancelled on every button so a click keeps the selection in the box — without
       it the box blurs first and `execCommand` has nothing to format. -->
  <div class="rich-text-editor__toolbar" role="toolbar" aria-label="Text formatting">
    <button
      type="button"
      aria-label="Bold"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="format('bold')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8" />
      </svg>
    </button>
    <button
      type="button"
      aria-label="Italic"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="format('italic')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="19" x2="10" y1="4" y2="4" />
        <line x1="14" x2="5" y1="20" y2="20" />
        <line x1="15" x2="9" y1="4" y2="20" />
      </svg>
    </button>
    <button
      type="button"
      aria-label="Underline"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="format('underline')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 4v6a6 6 0 0 0 12 0V4" />
        <line x1="4" x2="20" y1="20" y2="20" />
      </svg>
    </button>
    <button
      type="button"
      aria-label="Bulleted list"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="format('insertUnorderedList')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 5h.01" />
        <path d="M3 12h.01" />
        <path d="M3 19h.01" />
        <path d="M8 5h13" />
        <path d="M8 12h13" />
        <path d="M8 19h13" />
      </svg>
    </button>
    <button
      type="button"
      aria-label="Numbered list"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="format('insertOrderedList')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5h10" />
        <path d="M11 12h10" />
        <path d="M11 19h10" />
        <path d="M4 4h1v5" />
        <path d="M4 9h2" />
        <path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02" />
      </svg>
    </button>
  </div>
</section>
