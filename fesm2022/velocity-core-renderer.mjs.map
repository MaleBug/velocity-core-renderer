<p-inputnumber
  mode="currency"
  [inputId]="inputId()"
  [ngModel]="value()"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onValueChange($event)"
  (onBlur)="blurred.emit()"
  [currency]="currency()"
  [currencyDisplay]="config().currencyDisplay"
  [locale]="locale()"
  [step]="config().step"
  [useGrouping]="config().useGrouping"
  [minFractionDigits]="minFractionDigits()"
  [maxFractionDigits]="maxFractionDigits()"
  [showButtons]="config().showButtons"
  [buttonLayout]="config().buttonLayout"
  [placeholder]="config().placeholder"
  [showClear]="config().showClear"
  [allowEmpty]="config().allowEmpty"
  [required]="required()"
  [disabled]="disabled()"
  [invalid]="invalid() || hasRangeError()"
  [size]="primeSize()"
  [attr.aria-describedby]="hasRangeError() ? inputId() + '-range-error' : null"
/>

@if (hasRangeError()) {
  <!-- Reported instead of letting `p-inputnumber` silently clamp the amount to a bound — see
       `rangeError`. -->
  <small class="currency-field-input__error" [id]="inputId() + '-range-error'">
    {{ rangeError() }}
  </small>
}
