<!-- Bound to `displayValue` rather than to `value` so the control's own text is not repainted
     under the user while they are typing a date — see its doc. `ngModelChange` still reports
     every keystroke, so the value this renderer publishes is unaffected. -->
<p-datepicker
  [inputId]="inputId()"
  [ngModel]="displayValue()"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onValueChange($event)"
  (onFocus)="onFocus()"
  (onBlur)="onBlur()"
  (onInput)="onTextInput($event)"
  [dateFormat]="config().dateFormat"
  [selectionMode]="config().selectionMode"
  [showTime]="config().showTime"
  [hourFormat]="config().hourFormat"
  [showSeconds]="config().showSeconds"
  [stepMinute]="config().stepMinute"
  [showIcon]="config().showIcon"
  [iconDisplay]="config().iconDisplay"
  [minDate]="minDate()"
  [maxDate]="maxDate()"
  [numberOfMonths]="effectiveNumberOfMonths()"
  [showButtonBar]="config().showButtonBar"
  [showClear]="config().showClear"
  [readonlyInput]="config().readonlyInput"
  [inline]="config().inline"
  [view]="effectiveView()"
  [placeholder]="config().placeholder"
  [required]="required()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  appendTo="body"
/>
