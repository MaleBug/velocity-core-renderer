<!-- One static glyph. This used to toggle between `pi-image` and `pi-video` off the old `fileType`
     member; `MediaFileExtension` replaced it and cannot yet express that difference — see
     `iconLabel`. -->
<i
  class="media-field-input__icon pi pi-image"
  [id]="inputId()"
  role="img"
  [attr.aria-label]="iconLabel"
></i>
