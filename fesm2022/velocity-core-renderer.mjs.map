@if (options().length === 0) {
  <!-- Only reachable through a hand-edited config: the config editor requires at least one
       option, and the host's submit guard blocks a save without one. -->
  <p class="radio-field__empty">This field has no options to choose from yet.</p>
} @else {
  <div
    class="radio-field__options"
    [class.radio-field__options--horizontal]="config().orientation === 'horizontal'"
    role="radiogroup"
    [attr.aria-label]="groupName()"
  >
    @for (option of options(); track option.value) {
      <div class="radio-field__option">
        <p-radiobutton
          [inputId]="optionId(option.value)"
          [name]="groupName()"
          [value]="option.value"
          [ngModel]="value()"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="onValueChange($event)"
          [required]="required()"
          [disabled]="disabled()"
          [invalid]="invalid()"
          [size]="primeSize()"
        />
        <label class="radio-field__label" [attr.for]="optionId(option.value)">
          {{ option.label }}
        </label>
      </div>
    }
  </div>

  @if (canClear()) {
    <p-button
      label="Clear"
      icon="pi pi-times"
      severity="secondary"
      [text]="true"
      type="button"
      [disabled]="disabled()"
      (onClick)="clear()"
    />
  }
}
