@if (options().length === 0) {
  <!-- Only reachable through a hand-edited config: the config editor requires at least one
       option, and the host's submit guard blocks a save without one. -->
  <p class="select-field__empty">This field has no options to choose from yet.</p>
} @else if (isMultiple()) {
  <!-- `filterPlaceHolder` is PrimeNG's own spelling on this component — `p-select` below takes
       the same setting as `filterPlaceholder`. -->
  <p-multiselect
    [inputId]="inputId()"
    [options]="options()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="multipleValue()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onMultipleChange($event)"
    [placeholder]="placeholder()"
    [showClear]="config().showClear"
    [filter]="config().filter"
    [filterPlaceHolder]="filterPlaceholder()"
    [highlightOnSelect]="config().highlightOnSelect"
    [required]="required()"
    [disabled]="disabled()"
    [invalid]="invalid()"
    [size]="primeSize()"
    appendTo="body"
  />
} @else {
  <p-select
    [inputId]="inputId()"
    [options]="options()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="singleValue()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onSingleChange($event)"
    [placeholder]="placeholder()"
    [showClear]="config().showClear"
    [filter]="config().filter"
    [filterPlaceholder]="filterPlaceholder()"
    [checkmark]="config().checkmark"
    [required]="required()"
    [disabled]="disabled()"
    [invalid]="invalid()"
    [size]="primeSize()"
    appendTo="body"
  />
}
