<div class="abstract-header">
  <div class="abstract-header__start">
    <p-iconfield class="abstract-header__search">
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="search"
        placeholder="Search clause data point..."
        aria-label="Search clause data point"
        [(ngModel)]="search"
      />
    </p-iconfield>
    <p-button
      icon="pi pi-plus-circle"
      label="Add Clause"
      [rounded]="true"
      (onClick)="addClause.emit()"
    />
  </div>

  <div class="abstract-header__end">
    <span class="abstract-header__template">
      <span class="abstract-header__template-label">Abstract Template:</span>
      @if (templateName(); as name) {
        <button type="button" class="abstract-header__template-name" (click)="selectTemplate.emit()">
          {{ name }}
        </button>
      } @else {
        <button type="button" class="abstract-header__template-empty" (click)="selectTemplate.emit()">
          No Template Selected
        </button>
      }
    </span>
    <p-button
      icon="pi pi-download"
      label="Export Abstracts"
      [outlined]="true"
      [rounded]="true"
      (onClick)="exportAbstracts.emit()"
    />
  </div>
</div>
