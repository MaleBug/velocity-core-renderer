<article class="clause-card">
  <header class="clause-card__header">
    <h3 class="clause-card__title">{{ clause().name }}</h3>
    <span class="clause-card__tools">
      <button type="button" class="clause-card__add" (click)="addDataPoint.emit(clause().id)">
        Add Data Point
      </button>
      <button
        type="button"
        class="clause-card__fold"
        (click)="toggle()"
        [attr.aria-expanded]="expanded()"
        [attr.aria-label]="expanded() ? 'Collapse ' + clause().name : 'Expand ' + clause().name"
      >
        <i class="pi" [class.pi-chevron-up]="expanded()" [class.pi-chevron-down]="!expanded()" aria-hidden="true"></i>
      </button>
    </span>
  </header>

  @if (expanded()) {
    <ul class="clause-card__rows">
      @for (detail of clause().details; track detail.id) {
        <li class="clause-card__row">
          <span class="clause-card__label">{{ detail.label }}</span>
          <span class="clause-card__actions">
            <button
              type="button"
              class="clause-card__icon"
              aria-label="Edit {{ detail.label }}"
              (click)="editRow.emit(detailRef(detail))"
            >
              <i class="pi pi-pencil" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="clause-card__icon"
              aria-label="Copy {{ detail.label }}"
              (click)="copyRow.emit(detailRef(detail))"
            >
              <i class="pi pi-clone" aria-hidden="true"></i>
            </button>
          </span>
        </li>
        @for (point of detail.points; track point.id) {
          <li class="clause-card__row clause-card__row--point">
            <span class="clause-card__label">{{ point.label }}</span>
            <span class="clause-card__actions">
              <button
                type="button"
                class="clause-card__icon"
                aria-label="Edit {{ point.label }}"
                (click)="editRow.emit(pointRef(detail, point))"
              >
                <i class="pi pi-pencil" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="clause-card__icon"
                aria-label="Copy {{ point.label }}"
                (click)="copyRow.emit(pointRef(detail, point))"
              >
                <i class="pi pi-clone" aria-hidden="true"></i>
              </button>
            </span>
          </li>
        }
      }
    </ul>
  }
</article>
