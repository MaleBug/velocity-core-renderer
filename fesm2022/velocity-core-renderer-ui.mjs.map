<vcr-abstract-summary-header
  [(search)]="search"
  [templateName]="templateName()"
  (addClause)="addClause.emit()"
  (exportAbstracts)="exportAbstracts.emit()"
  (selectTemplate)="selectTemplate.emit()"
/>

@if (!hasTemplate()) {
  <div class="abstract-summary__empty">
    <span class="abstract-summary__mark" aria-hidden="true">
      <i class="pi pi-file"></i>
      <i class="pi pi-search"></i>
    </span>
    <p class="abstract-summary__empty-title">Select a template</p>
    <p class="abstract-summary__empty-note">Click the button below to choose a clause abstract template.</p>
    <button type="button" class="abstract-summary__select" (click)="selectTemplate.emit()">
      <i class="pi pi-table" aria-hidden="true"></i>
      Select Template
    </button>
  </div>
} @else if (visibleClauses().length === 0) {
  <p class="abstract-summary__none">No clause data points match this search.</p>
} @else {
  <div class="abstract-summary__cards">
    @for (clause of visibleClauses(); track clause.id) {
      <vcr-abstract-clause-card
        [clause]="clause"
        (addDataPoint)="addDataPoint.emit($event)"
        (editRow)="editRow.emit($event)"
        (copyRow)="copyRow.emit($event)"
      />
    }
  </div>
}
